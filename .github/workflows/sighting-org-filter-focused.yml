name: sighting-org-filter-focused
on:
  push:
    branches:
      - staging/r2-sighting-org-id-quick-20261119
jobs:
  sighting-org-filter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          sparse-checkout: |
            app/Model/Sighting.php
            app/Test/SightingOrgIdTestFixture.php
            app/Test/SightingRestSearchOrgIdTest.php
          sparse-checkout-cone-mode: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpunit:9.6
          coverage: none
      - name: Validate PHP syntax and focused regression tests
        run: |
          php -l app/Model/Sighting.php
          php -l app/Test/SightingOrgIdTestFixture.php
          php -l app/Test/SightingRestSearchOrgIdTest.php
          mkdir -p app/Vendor
          printf '<?php\\n' > app/Vendor/autoload.php
          phpunit --no-coverage --colors=never app/Test/SightingRestSearchOrgIdTest.php
